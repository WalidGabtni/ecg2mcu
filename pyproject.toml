[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg2mcu"
version = "0.1.0"
description = "Train, quantize and verify ECG classifiers for ESP32 microcontrollers (TFLite Micro)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Walid Gabtni" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["tinyml", "ecg", "esp32", "pytorch", "tflite-micro", "quantization"]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "torch>=2.5",
]

[project.optional-dependencies]
# Full PTB-XL dataset loading (the bundled sample needs neither)
ptbxl = ["pandas>=2.1", "wfdb>=4.1"]
# INT8 TFLite export and verification
export = ["tensorflow>=2.16"]
dev = ["pytest>=8", "pandas>=2.1", "wfdb>=4.1", "tensorflow>=2.16"]

[project.scripts]
ecg2mcu = "ecg2mcu.cli:main"

[tool.setuptools.packages.find]
include = ["ecg2mcu*"]

[tool.setuptools.package-data]
ecg2mcu = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs training + TFLite export (needs tensorflow)"]
